<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#0e1317">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Vocab Trainer</title>
<style>
  :root {
    --bg: #0e1317; --surf: #161d23; --line: #26323b;
    --ink: #e6edf2; --muted: #8393a0;
    --acc: #5fc4b8; --good: #6fcf97; --bad: #e8806f; --warn: #d9b44a;
    --dark: #0b1216;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 640px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font: 22px Georgia, serif; margin: 0; }
  button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--surf);
    border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  button:active { filter: brightness(1.2); }
  .primary { background: var(--acc); color: var(--dark); font-weight: 600; border-color: var(--acc); }
  .good { background: var(--good); color: var(--dark); font-weight: 600; border-color: var(--good); }
  .bad { background: var(--bad); color: var(--dark); font-weight: 600; border-color: var(--bad); }
  .icon { padding: 8px 12px; font-size: 18px; line-height: 1; }
  select { font: inherit; color: var(--ink); background: var(--surf); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; max-width: 60%; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .count { color: var(--muted); font-size: 13px; text-align: right; }
  .card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: var(--surf); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px 18px; min-height: 340px; }
  .card > * { max-width: 100%; }
  .word { font: 30px/1.25 Georgia, serif; text-align: center; overflow-wrap: anywhere; }
  .speak { display: flex; gap: 8px; }
  .speak[hidden] { display: none; }
  input[type=text], input[type=search] { width: 100%; -webkit-appearance: none; font-size: 20px; text-align: center; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; outline: none; }
  input[type=text]:focus, input[type=search]:focus { border-color: var(--acc); }
  input[hidden] { display: none; }
  .verdict { text-align: center; font-size: 17px; min-height: 1.4em; }
  .btns { display: flex; gap: 10px; width: 100%; }
  .btns button { flex: 1; }
  dialog { background: var(--surf); color: var(--ink); border: 1px solid var(--line); border-radius: 16px;
    width: min(92vw, 480px); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font: 20px Georgia, serif; margin: 0 0 12px; }
  dialog h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid var(--line); }
  .opt input { width: 22px; height: 22px; accent-color: var(--acc); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .tabs { display: flex; gap: 4px; background: var(--surf); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; padding: 8px; background: none; color: var(--muted); }
  .tabs button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
  .view { flex: 1; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  input.field { text-align: left; font-size: 17px; margin-bottom: 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tools button { padding: 9px 12px; font-size: 15px; }
  .tools[hidden], .editbar[hidden] { display: none; }
  .list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surf); }
  .list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list .en { color: var(--muted); font-size: 14px; }
  .list .pt { color: var(--ink); font-size: 17px; }
  .list input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--acc); flex: none; margin: 0; }
  .list .icon { padding: 6px 10px; font-size: 16px; flex: none; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Vocab Trainer</h1>
  <button class="icon" id="menuBtn" aria-label="Settings">⚙︎</button>
</header>

<nav class="tabs">
  <button id="tabLearn" class="on">Learn</button>
  <button id="tabCards">Cards</button>
</nav>

<section class="view" id="learnView">
<div class="bar">
  <select id="deck" aria-label="Deck to practise"></select>
  <div class="count" id="count"></div>
</div>

<main class="card">
  <div class="word" id="word">Loading cards …</div>
  <div class="speak" id="speak" hidden>
    <button class="icon" id="say" aria-label="Read aloud">🔊</button>
    <button class="icon" id="saySlow" aria-label="Read aloud slowly">🐢</button>
  </div>
  <input type="text" id="ent" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" enterkeyhint="go" placeholder="Answer">
  <div class="verdict" id="verdict"></div>
  <div class="btns" id="btns"></div>
</main>
</section>

<section class="view" id="cardsView" hidden>
  <div class="bar">
    <select id="browseDeck" aria-label="Deck to show"></select>
    <div class="count" id="browseCount"></div>
  </div>
  <input type="search" class="field" id="search" placeholder="Search" autocomplete="off"
         autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="editbar" id="editbar" hidden>
    <input type="text" class="field" id="deckName" placeholder="Name of your deck" autocomplete="off">
  </div>
  <div class="tools" id="tools"></div>
  <ul class="list" id="list"></ul>
</section>

<dialog id="menu">
  <h2>Settings</h2>
  <label class="opt">Reverse (Portuguese → English)<input type="checkbox" id="optReverse"></label>
  <label class="opt">No typing (just reveal)<input type="checkbox" id="optNoType"></label>
  <label class="opt">Read Portuguese aloud automatically<input type="checkbox" id="optAuto"></label>
  <h3>Practice</h3>
  <div class="stack">
    <button id="randomBtn">New selection (50, all decks)</button>
  </div>
  <h3>Progress on this device</h3>
  <div class="stack">
    <button id="saveProg">Save progress</button>
    <button id="loadProg">Load progress</button>
    <button id="resetProg">Reset progress</button>
    <input type="file" id="progFile" accept="application/json,.json" hidden>
  </div>
  <div class="note" id="info"></div>
  <div class="stack" style="margin-top:16px"><button class="primary" id="closeMenu">Done</button></div>
</dialog>

<script>
const DAY = 86400;
const INTERVALS = [1, 2, 4, 8, 16, 32, 64];
const MIN_NEW = 30, MAX_NEW = 50, RANDOM_SIZE = 50;
// Stapel-Werte: "all", "problem", "d:<Stapel aus der Datenbank>", "m:<eigener Stapel>"
const ALL = "all", PROBLEM = "problem";
const PKEY = "vt-progress", SKEY = "vt-settings", DKEY = "vt-decks";
const FIELDS = ["due", "box", "lapses", "reps", "streak"];
const $ = id => document.getElementById(id);

// ---------- Speicher (localStorage ist in privaten Tabs evtl. gesperrt) ----------
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

let cards = [], byId = new Map(), exportedAt = null;
let progress = load(PKEY, {});
let myDecks = load(DKEY, {});   // eigene Stapel: { Name: [Karten-IDs] }, nur auf diesem Gerät
const settings = Object.assign({ reverse: false, noType: false, auto: false, deck: ALL }, load(SKEY, {}));
let queue = [], relearn = new Set(), state = "empty", card = null, suggest = false;
const sess = { ok: 0, no: 0 };

// ---------- Bewertung ----------
const norm = s => s.toLocaleLowerCase("pt").trim().replace(/\s+/g, " ");
// Lockerer Vergleich: ohne Akzente, Klammern, Satzzeichen und Leerzeichen um Bindestriche
const loose = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[()\[\]?!.,¿¡…]/g, "").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();
const alternatives = a => [a.trim(), a.replace(/\s+\([^)]*\)/g, "").trim(),
  ...a.split(/[;/|,]/).map(p => p.trim()).filter(Boolean)];

function similarity(a, b) {
  if (!a.length && !b.length) return 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[b.length] / Math.max(a.length, b.length);
}

function judge(given, answer) {
  if (!given.trim()) return "none";
  const alts = alternatives(answer);
  if (alts.map(norm).includes(norm(given))) return "ok";
  const g = loose(given), la = alts.map(loose);
  if (la.includes(g) || la.some(a => similarity(g, a) >= 0.85)) return "near";
  return "wrong";
}

// ---------- Karten & Lernlogik (wie in der Desktop-App) ----------
const now = () => Date.now() / 1000;
const score = (c, t = now()) => (t - c.due) / DAY + 2 * Math.min(c.lapses, 5);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function cardsIn(deck) {
  if (deck === PROBLEM) return cards.filter(c => c.lapses >= 2 && c.streak < 3);
  if (deck.startsWith("d:")) return cards.filter(c => c.deck === deck.slice(2));
  if (deck.startsWith("m:")) return (myDecks[deck.slice(2)] || []).map(id => byId.get(id)).filter(Boolean);
  return cards;
}

function validDeck(deck) {
  return deck === ALL || deck === PROBLEM ||
    (deck.startsWith("d:") && cards.some(c => c.deck === deck.slice(2))) ||
    (deck.startsWith("m:") && deck.slice(2) in myDecks);
}

function buildQueue(deck) {
  if (deck === PROBLEM)
    return cardsIn(PROBLEM).sort((a, b) => b.lapses - a.lapses || a.streak - b.streak);
  const pool = cardsIn(deck);
  const t = now();
  const due = pool.filter(c => c.reps > 0 && c.due <= t).sort((a, b) => score(b, t) - score(a, t));
  const limit = MIN_NEW + Math.floor(Math.random() * (MAX_NEW - MIN_NEW + 1));
  const fresh = shuffle(pool.filter(c => c.reps === 0)).slice(0, limit);
  return [...due, ...fresh];
}

function answerCard(c, ok, isRelearn) {
  const t = now();
  if (isRelearn) {
    if (ok) { c.due = t + INTERVALS[c.box] * DAY; c.streak++; }
    else c.due = t + 600;
  } else if (ok) {
    c.due = t + INTERVALS[c.box] * DAY;
    c.box = Math.min(c.box + 1, 6); c.streak++; c.reps++;
  } else {
    c.box = Math.max(0, c.box - 2); c.lapses++; c.streak = 0; c.reps++;
    c.due = t + 600;
  }
  progress[c.id] = Object.fromEntries(FIELDS.map(f => [f, c[f]]));
  store(PKEY, progress);
}

// ---------- Vorlesen (Web Speech API, europäisches Portugiesisch) ----------
let ptVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase() === "pt-pt");
  ptVoice = voices.find(v => /enhanced|premium|erweitert/i.test(v.name)) || voices[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text, slow = false) {
  if (!("speechSynthesis" in window)) return;
  const spoken = text.replace(/[()\[\]]/g, "").replace(/\.\.\.|…/g, " ").replace(/\s*-\s*/g, "-").replace(/\//g, ", ");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken);
  u.lang = "pt-PT";
  if (ptVoice) u.voice = ptVoice;
  u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
const portuguese = () => card ? card.back : "";

// ---------- Oberfläche ----------
const ent = $("ent"), word = $("word"), verdict = $("verdict");

function sides() {
  return settings.reverse ? [card.back, card.front] : [card.front, card.back];
}

function setButtons(items) {
  const box = $("btns");
  box.replaceChildren(...items.map(([text, fn, kind]) => {
    const b = document.createElement("button");
    b.textContent = text;
    if (kind) b.className = kind;
    b.addEventListener("click", fn);
    return b;
  }));
}

function updateCount() {
  $("count").textContent = `${queue.length} left · ✓ ${sess.ok} · ✗ ${sess.no}`;
}

function fillDeckSelect(sel, value) {
  const opt = (v, text) => new Option(text, v, false, v === value);
  const group = (label, opts) => {
    const g = document.createElement("optgroup");
    g.label = label;
    g.append(...opts);
    return g;
  };
  const builtIn = [...new Set(cards.map(c => c.deck))].sort();
  const mine = Object.keys(myDecks).sort((a, b) => a.localeCompare(b));
  const items = [opt(ALL, `All cards (${cards.length})`), opt(PROBLEM, "Problem cards"),
    group("Decks", builtIn.map(d => opt("d:" + d, `${d} (${cardsIn("d:" + d).length})`)))];
  if (mine.length) items.push(group("My decks", mine.map(d => opt("m:" + d, `${d} (${cardsIn("m:" + d).length})`))));
  sel.replaceChildren(...items);
}

function refreshDecks() {
  if (!validDeck(settings.deck)) settings.deck = ALL;
  fillDeckSelect($("deck"), settings.deck);
}

function startSession(random = false) {
  const pool = random === "deck" ? cardsIn(settings.deck) : cards;
  const list = random ? shuffle([...pool]).slice(0, RANDOM_SIZE) : buildQueue(settings.deck);
  queue = list.map(c => c.id);
  relearn.clear();
  sess.ok = sess.no = 0;
  nextCard();
}

function nextCard() {
  updateCount();
  verdict.textContent = "";
  ent.value = "";
  if (!queue.length) {
    card = null;
    state = cards.length ? "done" : "empty";
    word.textContent = cards.length ? "All done for today." : "No cards yet.";
    ent.hidden = true;
    $("speak").hidden = true;
    setButtons(cards.length ? [["Keep practising this deck", () => startSession("deck")]] : []);
    return;
  }
  card = byId.get(queue[0]);
  state = "ask";
  word.textContent = sides()[0];
  $("speak").hidden = !settings.reverse;
  ent.hidden = settings.noType;
  if (settings.noType) {
    setButtons([["Reveal", () => reveal("none"), "primary"]]);
  } else {
    setButtons([["Check", check, "primary"], ["Don't know", () => reveal("none")]]);
    ent.focus();
  }
  if (settings.reverse && settings.auto) speak(portuguese());
}

function check() { reveal(judge(ent.value, sides()[1])); }

function reveal(result) {
  const answer = sides()[1];
  state = "revealed";
  suggest = result === "ok" || result === "near";
  const [text, color] = {
    ok: [`Correct: ${answer}`, "var(--good)"],
    near: [`Almost. Watch the spelling: ${answer}`, "var(--warn)"],
    wrong: [`Wrong. Correct answer: ${answer}`, "var(--bad)"],
    none: [settings.noType ? answer : `Answer: ${answer}`, settings.noType ? "var(--ink)" : "var(--muted)"],
  }[result];
  verdict.textContent = text;
  verdict.style.color = color;
  $("speak").hidden = false;
  if (!settings.reverse && settings.auto) speak(portuguese());
  const neutral = result === "none";
  setButtons([
    ["I knew it", () => rate(true), neutral ? "" : suggest ? "good" : ""],
    ["Didn't know", () => rate(false), neutral ? "" : suggest ? "" : "bad"],
  ]);
  if (!settings.noType && result !== "none") ent.blur();
}

function rate(ok) {
  if (state !== "revealed" || !card) return;
  const id = card.id, wasRelearn = relearn.has(id);
  answerCard(card, ok, wasRelearn);
  queue.shift();
  if (ok) { relearn.delete(id); sess.ok++; }
  else {
    sess.no++;
    relearn.add(id);
    // Rest nach Priorität sortieren, Fehler kommt nach 3 Karten wieder
    const t = now();
    queue.sort((a, b) => score(byId.get(b), t) - score(byId.get(a), t));
    queue.splice(Math.min(3, queue.length), 0, id);
  }
  nextCard();
}

ent.addEventListener("keydown", e => {
  if (e.key === "Enter" && state === "ask") { e.preventDefault(); check(); }
});
document.addEventListener("keydown", e => {
  if (view !== "learn" || state !== "revealed" || e.target === ent || $("menu").open) return;
  if (e.key === "Enter") rate(suggest);
  else if (e.key.toLowerCase() === "y") rate(true);
  else if (e.key.toLowerCase() === "n") rate(false);
});
$("say").addEventListener("click", () => speak(portuguese()));
$("saySlow").addEventListener("click", () => speak(portuguese(), true));
$("deck").addEventListener("change", e => { settings.deck = e.target.value; store(SKEY, settings); startSession(); });

// ---------- Ansichten: Lernen / Karten ----------
let view = "learn", learnDirty = false;

function showView(v) {
  view = v;
  $("learnView").hidden = v !== "learn";
  $("cardsView").hidden = v !== "cards";
  $("tabLearn").classList.toggle("on", v === "learn");
  $("tabCards").classList.toggle("on", v === "cards");
  if (v === "cards") return renderBrowse();
  const before = settings.deck;
  refreshDecks();
  if (learnDirty || settings.deck !== before || state === "done" || state === "empty") startSession();
  learnDirty = false;
}
$("tabLearn").addEventListener("click", () => showView("learn"));
$("tabCards").addEventListener("click", () => showView("cards"));

// ---------- Karten ansehen & eigene Stapel ----------
let browse = ALL, editing = null;   // editing: { orig: alter Name oder null, sel: Set von IDs }

function button(text, fn, kind) {
  const b = document.createElement("button");
  b.textContent = text;
  if (kind) b.className = kind;
  b.addEventListener("click", fn);
  return b;
}

function renderTools() {
  $("browseCount").textContent = editing ? `${editing.sel.size} selected` : `${cardsIn(browse).length} cards`;
  const tools = [];
  if (editing) {
    tools.push(button(`Save deck (${editing.sel.size})`, saveDeck, "primary"), button("Cancel", cancelEdit));
  } else {
    tools.push(button("+ New deck", () => startEdit(null)));
    if (browse.startsWith("m:"))
      tools.push(button("Edit deck", () => startEdit(browse.slice(2))), button("Delete deck", deleteDeck));
    if (browse !== ALL)
      tools.push(button("Practise this deck", () => {
        settings.deck = browse;
        store(SKEY, settings);
        learnDirty = true;
        showView("learn");
      }));
  }
  $("tools").replaceChildren(...tools);
}

function renderBrowse() {
  if (!validDeck(browse)) browse = ALL;
  fillDeckSelect($("browseDeck"), browse);
  $("editbar").hidden = !editing;
  renderTools();
  const q = loose($("search").value);
  const shown = cardsIn(browse).filter(c => !q || loose(c.front).includes(q) || loose(c.back).includes(q))
    .sort((a, b) => a.deck.localeCompare(b.deck) || a.id - b.id);
  if (!shown.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No cards found.";
    return $("list").replaceChildren(li);
  }
  $("list").replaceChildren(...shown.map(c => {
    const li = document.createElement("li");
    if (editing) {
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = editing.sel.has(c.id);
      cb.setAttribute("aria-label", c.front);
      cb.addEventListener("change", () => {
        cb.checked ? editing.sel.add(c.id) : editing.sel.delete(c.id);
        renderTools();
      });
      li.append(cb);
      li.addEventListener("click", e => { if (e.target === li || e.target.closest(".txt")) cb.click(); });
    }
    const txt = document.createElement("div");
    txt.className = "txt";
    const pt = Object.assign(document.createElement("div"), { className: "pt", textContent: c.back });
    const en = Object.assign(document.createElement("div"), { className: "en", textContent: c.front });
    txt.append(pt, en);
    const say = button("🔊", () => speak(c.back), "icon");
    say.setAttribute("aria-label", "Read aloud");
    li.append(txt, say);
    return li;
  }));
}

function startEdit(name) {
  editing = { orig: name, sel: new Set(name ? myDecks[name] : []) };
  $("deckName").value = name || "";
  browse = ALL;   // beim Zusammenstellen alle Karten zeigen; über die Auswahl oben filterbar
  renderBrowse();
  if (!name) $("deckName").focus();
}

function cancelEdit() {
  const name = editing.orig;
  editing = null;
  if (name) browse = "m:" + name;
  renderBrowse();
}

function saveDeck() {
  const name = $("deckName").value.trim();
  if (!name) return alert("Please give your deck a name.");
  if (!editing.sel.size) return alert("Tick at least one card.");
  if (name !== editing.orig && name in myDecks) return alert("You already have a deck with this name.");
  if (editing.orig && editing.orig !== name) delete myDecks[editing.orig];
  myDecks[name] = cards.filter(c => editing.sel.has(c.id)).map(c => c.id);
  store(DKEY, myDecks);
  if (editing.orig && settings.deck === "m:" + editing.orig) {
    settings.deck = "m:" + name;
    store(SKEY, settings);
    learnDirty = true;
  }
  editing = null;
  browse = "m:" + name;
  renderBrowse();
}

function deleteDeck() {
  const name = browse.slice(2);
  if (!confirm(`Delete your deck "${name}"? The cards themselves stay.`)) return;
  delete myDecks[name];
  store(DKEY, myDecks);
  if (settings.deck === browse) learnDirty = true;
  browse = ALL;
  renderBrowse();
}

$("browseDeck").addEventListener("change", e => { browse = e.target.value; renderBrowse(); });
$("search").addEventListener("input", renderBrowse);

// ---------- Einstellungen ----------
const menu = $("menu");
$("menuBtn").addEventListener("click", () => {
  $("optReverse").checked = settings.reverse;
  $("optNoType").checked = settings.noType;
  $("optAuto").checked = settings.auto;
  const learned = Object.keys(progress).length;
  $("info").textContent = `${cards.length} cards` +
    (exportedAt ? `, last updated: ${new Date(exportedAt * 1000).toLocaleString("en-GB")}` : "") +
    `. Practised on this device: ${learned} cards.`;
  menu.showModal();
});
for (const [id, key] of [["optReverse", "reverse"], ["optNoType", "noType"], ["optAuto", "auto"]])
  $(id).addEventListener("change", e => { settings[key] = e.target.checked; store(SKEY, settings); });
$("closeMenu").addEventListener("click", () => { menu.close(); startSession(); });
$("randomBtn").addEventListener("click", () => { menu.close(); startSession(true); });

$("saveProg").addEventListener("click", async () => {
  const name = `vocab-progress-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(progress)], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
    return;
  }
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(file), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("loadProg").addEventListener("click", () => $("progFile").click());
$("progFile").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    progress = JSON.parse(await f.text());
    store(PKEY, progress);
    applyProgress();
    learnDirty = true;
    alert("Progress loaded.");
  } catch { alert("Could not read that file."); }
  e.target.value = "";
});
$("resetProg").addEventListener("click", () => {
  if (!confirm("Delete the progress on this device and start over?")) return;
  progress = {};
  store(PKEY, progress);
  applyProgress();
  learnDirty = true;
});

// ---------- Start ----------
let raw = [];
function applyProgress() {
  const fresh = { due: 0, box: 0, lapses: 0, reps: 0, streak: 0 };
  cards = raw.map(c => Object.assign({}, fresh, c, progress[c.id] || {}));
  byId = new Map(cards.map(c => [c.id, c]));
}

async function init() {
  try {
    const res = await fetch("karten.json", { cache: "no-cache" });
    const data = await res.json();
    raw = data.cards;
    exportedAt = data.exported;
  } catch {
    word.textContent = "Could not load the cards.";
    ent.hidden = true;
    return;
  }
  applyProgress();
  refreshDecks();
  startSession();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
init();
</script>
</body>
</html>
